<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<section>
<nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>
<header>
<h1>Hallo Hi</h1>
<button type="button">Bekijk deal</button>
<button type="button">Ontdek meer</button>
</header>
<section>
<h2>Welkom bij Hallo Hi</h2>
<h4>Vul dit formulier in:</h4>
<form>
<table>
<tr>
<td><label for="name">Naam:</label></td>
<td><input type="text" id="name" name="name" pattern="[A-Za-zÀ-ÿ\s]+"></td>
</tr>
<tr>
<td><label for="lastname">Achternaam:</label></td>
<td><input type="text" id="lastname" name="lastname" pattern="[A-Za-zÀ-ÿ\s]+"></td>
</tr>
<tr>
<td><label>Geslacht:</label></td>
<td>
<input type="radio" id="male" name="gender" value="male" checked>
<label for="male">Dhr.</label>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Mevr.</label>
<input type="radio" id="other" name="gender" value="other">
<label for="other">Anders</label>
</td>
</tr>
<tr>
<td><label for="adress">Straat en huisnummer:</label></td>
<td><input type="text" id="adress" name="adress" placeholder="Stationsweg 12"></td>
</tr>
<tr>
<td><label for="postcode">Postcode:</label></td>
<td><input type="text" id="postcode" name="postcode" placeholder="1234 AB"></td>
</tr>
<tr>
<td><label for="land">Land:</label></td>
<td><select id="land" name="land">
<option value="Nederland">Nederland</option>
<option value="België">België</option>
<option value="Duitsland">Duitsland</option>
<option value="Frankrijk">Frankrijk</option>
</select></td>
</tr>
<tr>
<td><label for="IBAN-nummer">IBAN-nummer:</label></td>
<td><input type="text" id="IBAN-nummer" name="IBAN-nummer" placeholder="NL12ABCD1234567890" maxlength="18" pattern="[A-Z]{2}[0-9]{2}[A-Z0-9]{4}[0-9]{10}"></td>
</tr>
<tr>
<td><label for="Type abonnement">Type abonnement:</label></td>
<td><select id="Type abonnement" name="Type abonnement">
<option value="Mobiel">Mobiel</option>
<option value="Glasvezel">Glasvezel</option>
<option value="TV">TV</option>
</select></td>
</tr>
<tr>
<td><label for="Datum van ingang abonnement">Datum van ingang abonnement:</label></td>
<td><input type="date" id="Datum van ingang abonnement" name="Datum van ingang abonnement" min="2026-09-27"></td>
</tr>
<tr>
<td><label for="Looptijd abonnement">Looptijd abonnement:</label></td>
<td><input type="number" id="Looptijd abonnement" name="Looptijd abonnement" min="1" max="24" placeholder="12"> maanden</td>
</tr>
<tr>
<td><label for="Aantal gebruikers op het abonnement">Aantal gebruikers op het abonnement:</label></td>
<td><input type="number" id="Aantal gebruikers op het abonnement" name="Aantal gebruikers op het abonnement" min="1" max="4"></td>
</tr>
<tr>
<td><label for="email">E-mail:</label></td>
<td><input type="email" id="email" name="email" required></td>
</tr>
<tr>
<td><label for="Wachtwoord">Wachtwoord:</label></td>
<td><input type="password" id="Wachtwoord" name="Wachtwoord" required></td>
</tr>
<tr>
<td></td>
<td><button type="submit">Verzend</button>
<button type="reset">Reset</button></td>
</tr>
</table>
</form>
</section>
<footer>
    <ul>
        <li><a href="#">Privacybeleid</a></li>
        <li><a href="#">Gebruiksvoorwaarden</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</footer>
</body>
</html>
